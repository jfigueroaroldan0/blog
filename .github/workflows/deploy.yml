name: Desplegar web

on:
  push:
    branches: [main]
  workflow_dispatch:        # botón "Run workflow" manual

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Instalar Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Instalar Hugo extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Dependencias del tema
        run: |
          hugo mod tidy
          hugo mod npm pack
          npm install --no-fund --no-audit

      - name: Compilar
        run: hugo --gc --minify

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # printf + tr: conserva el salto de línea final y quita los \r (saltos de línea de Windows)
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          # Falla aquí con un mensaje claro si el secreto no es una clave privada válida
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null \
            || { echo "::error::SSH_KEY no es una clave privada válida (¿falta BEGIN/END o pegaste la .pub?)"; exit 1; }
          echo "Clave cargada: $(ssh-keygen -lf ~/.ssh/id_ed25519)"

      - name: Subir al VPS
        run: |
          rsync -rlz --delete --chmod=D755,F644 \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519" \
            public/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/"
