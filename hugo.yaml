baseURL: https://jfigueroaroldan.org/
locale: es
title: "Jesús Figueroa · ASIR"

# Tema Toha como módulo de Hugo
module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: static
      target: static
    - source: static/files
      target: static/files
    - source: ./node_modules/flag-icons/flags
      target: static/flags
    - source: ./node_modules/@fontsource/mulish/files
      target: static/files
    - source: ./node_modules/katex/dist/fonts
      target: static/fonts

languages:
  es:
    locale: es
    label: Español
    title: "Jesús Figueroa · ASIR"
    weight: 1
defaultContentLanguage: es

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

enableEmoji: true

params:
  background: /images/site/background.jpg
  logo:
    main: /images/site/main-logo.png
    inverted: /images/site/inverted-logo.png
    favicon: /images/site/favicon.png
  gitRepo: https://github.com/jfigueroaroldan0/blog
  gitBranch: main
  topNavbar:
    maxVisibleSections: 5
  features:
    theme:
      enable: true
      services:
        light: true
        dark: true
        default: system
    portfolio:
      enable: true
    blog:
      enable: true
      showAuthor: true
      shareButtons:
        linkedin: true
        whatsapp: true
        email: true
    notes:
      enable: false
    comment:
      enable: false
    analytics:
      enable: false
    toc:
      enable: true
    tags:
      enable: true
      on_card: true
    flags:
      enable: false
    embedpdf:
      enable: true
    flowchart:
      enable: true
      services:
        mermaid:
          theme: default
    math:
      enable: false
    syntaxHighlight:
      enable: true
      services:
        hljs:
          noHighlightRe: /^no-highlight$/i
    copyCodeButton:
      enable: true
    readingTime:
      enable: true
    pagination:
      maxPostsPerPage: 12
  footer:
    enable: true
    navigation:
      enable: true
      customMenus: true
    contactMe:
      enable: true
    credentials:
      enable: true
    newsletter:
      enable: false
    disclaimer:
      enable: false
